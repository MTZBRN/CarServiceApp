services:
  backend:
    build:
      context: ./Backend/CarServiceShop
      dockerfile: Dockerfile
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ./backend-data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./user-uploads
        target: /app/uploads
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=134217728,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks:
      workshop:
        ipv4_address: 172.30.90.2
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY:?Supply an external random base64 signing key}
      - Jwt__Issuer=${JWT_ISSUER:?Supply the explicit issuer identifier}
      - Jwt__Audience=${JWT_AUDIENCE:?Supply the explicit audience identifier}
      - Uploads__Path=/app/uploads
      - ReverseProxy__KnownProxies__0=172.30.90.3
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/app.db

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=33554432,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

    networks:
      workshop:
        ipv4_address: 172.30.90.3

networks:
  workshop:
    ipam:
      config:
        - subnet: 172.30.90.0/24
