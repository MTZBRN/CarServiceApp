services:
  backend:
    build:
      # A kép alapján a Dockerfile a Backend/CarServiceShop mappában van
      context: ./Backend/CarServiceShop
      dockerfile: Dockerfile
    expose:
      - "8080"
    volumes:
      - ./backend-data:/app/data
      - ./user-uploads:/app/uploads
    networks:
      workshop:
        ipv4_address: 172.30.90.2
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY:?Supply an external random base64 signing key}
      - Uploads__Path=/app/uploads
      - ReverseProxy__KnownProxies__0=172.30.90.3
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/app.db

  frontend:
    build:
      # A kép alapján a Frontend mappa közvetlenül a gyökérben van
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

    networks:
      workshop:
        ipv4_address: 172.30.90.3

networks:
  workshop:
    ipam:
      config:
        - subnet: 172.30.90.0/24
