map $scheme $frontend_hsts {
    https "max-age=15552000";
    default "";
}
server {
    listen 8080;
    
    location = /api/Auth/upload-profile-picture {
        client_max_body_size 2162688;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://backend:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
    location /api/ { client_max_body_size 1m; proxy_pass http://backend:8080; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; }
    location /uploads/ { proxy_pass http://backend:8080; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
    }
}
