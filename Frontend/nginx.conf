map_hash_bucket_size 256;
# Maps cache their first evaluation for the request, including internal redirects.
map $request_method $log_method {
    default OTHER;
    GET GET; HEAD HEAD; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; OPTIONS OPTIONS;
}
# Only known routes are logged. Never copy arbitrary path segments into logs.
map $uri $log_path {
    default /[redacted];
    ~*^/api/(Appointments|Audit|Customers|Dashboard|JobParts|Parts|Seed|ServiceJobs|Settings|Users|Vehicle)/?$ $uri;
    ~*^/api/Auth/(login|me|activity|logout|change-password|upload-profile-picture)/?$ $uri;
    ~*^/api/(Appointments|Customers|Parts|ServiceJobs|Users|Vehicle)/[0-9]+/?$ /api/$1/:id;
    ~*^/api/ServiceJobs/(ByAppointment|ByVehicle)/[0-9]+/?$ /api/ServiceJobs/$1/:id;
    ~^/(dashboard|customers|vehicles|calendar|worksheets|inventory|settings|users|audit|login|privacy)/?$ $uri;
    ~^/(vehicles|worksheets)/[0-9]+/?$ /$1/:id;
    /worksheets/new /worksheets/new;
    / /;
    /index.html /index.html;
    /healthz /healthz;
    ~^/assets/ /assets/[redacted];
    ~^/uploads/ /uploads/[redacted];
}

map "$remote_addr:$http_x_carservice_edge_token" $verified_edge {
    default 0;
    include /etc/nginx/trusted-edge.conf;
}

# The geo module maps invalid addresses to 255.255.255.255.
geo $http_x_carservice_edge_client $valid_edge_client {
    default 1;
    255.255.255.255 0;
}

# Require a single valid socket address and the HTTPS scheme from the same hop.
map "$verified_edge:$valid_edge_client:$http_x_carservice_edge_scheme:$http_x_carservice_edge_client" $verified_https {
    default 0;
    ~^1:1:https:[0-9A-Fa-f:.]+$ 1;
}
map $verified_https $forwarded_client {
    default $remote_addr;
    1 $http_x_carservice_edge_client;
}
map $verified_https $forwarded_scheme {
    default $scheme;
    1 https;
}
map $forwarded_scheme $frontend_hsts {
    https "max-age=15552000";
    default "";
}
server {
    listen 8080;
    # Force both lazy maps to cache the original values before any URI/method rewrite.
    set $log_request_snapshot "$log_method $log_path";
    
    location = /api/Auth/upload-profile-picture {
        client_max_body_size 2162688;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy-headers.conf;
    }
    location /api/ { client_max_body_size 1m; proxy_pass http://backend:8080; include /etc/nginx/proxy-headers.conf; }
    location /uploads/ { proxy_pass http://backend:8080; include /etc/nginx/proxy-headers.conf; }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
    }
}
