worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # HTTP error messages can append the full request line and referrer.
    # Keep process diagnostics on stderr and record HTTP failures via access_log.
    error_log /dev/null;
    log_format workshop escape=json
        '{"method":"$log_method","path":"$log_path","status":$status,'
        '"duration":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout workshop;
    sendfile on;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    include /etc/nginx/conf.d/*.conf;
}
