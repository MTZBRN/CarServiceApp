name: Gate C-D candidate disposable validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify authoritative package fingerprints
        run: python3 -I -B validation/gate-cd/verify_candidate.py
      - name: Verify isolated fixture metadata expectations
        run: python3 -I -B validation/gate-cd/test_internal_fixture.py -v
      - name: Verify Compose model normalization guards
        run: python3 -I -B validation/gate-cd/test_compose_models.py -v
      - name: Run the unchanged Gate C unit test suite
        run: python3 -I -B validation/carservice-gate-c/test_gate_c.py -v
      - name: Run the Gate D unit test suite
        run: python3 -I -B validation/carservice-gate-d/test_gate_d.py -v
      - name: Verify Gate D owner reader with real credential dropping
        run: |
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root \
            /usr/bin/python3 -I -B validation/gate-cd/test_owner_reader.py -v
      - name: Prepare public fictional fixture image
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker pull python:3.12-slim-bookworm
          docker save --output "$RUNNER_TEMP/gate-cd-fixture.tar" python:3.12-slim-bookworm
      - name: Run original Gate C Docker recovery tests and Gate D Compose checks
        env:
          FIXTURE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root \
            GITHUB_ACTIONS=true FIXTURE_ID="$FIXTURE_ID" \
            /usr/bin/python3 -I -B validation/gate-cd/disposable_daemon.py \
            "$RUNNER_TEMP/gate-cd-fixture.tar"
      - name: Stop only this run's private daemon
        if: always()
        env:
          FIXTURE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root \
            GITHUB_ACTIONS=true FIXTURE_ID="$FIXTURE_ID" \
            /usr/bin/python3 -I -B validation/gate-cd/disposable_daemon.py --cleanup
      - name: State validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Both original unit suites, original Gate C Docker recovery suite,
          and selected Gate D real Compose/storage checks are configured.
          Inspect step conclusions for results; this text is not a PASS assertion.
          Both candidate packages are present and fingerprint-verified.
          Fixture results do not grant operational or deployment approval.
          No production images, VPS, deployment secrets or deployment workflow used.
          EOF
      - name: Stage the original Gate C Docker PASS report
        id: gate-c-evidence
        env:
          FIXTURE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$FIXTURE_ID" =~ ^[0-9]+-[0-9]+$ ]]
          evidence_dir=$(mktemp -d "$RUNNER_TEMP/gate-c-evidence.XXXXXXXX")
          report="$evidence_dir/gate-c-docker-report.json"
          sudo cat -- "/tmp/carservice-gate-c-docker-$FIXTURE_ID/gate-c-docker-report.json" > "$report"
          read -r script_sha _ < <(sha256sum validation/carservice-gate-c/gate-c.py)
          jq -e --arg sha "$script_sha" '
            .status == "PASS" and .script_sha256 == $sha and
            (.docker_engine_version | type == "string" and length > 0)
          ' "$report" >/dev/null
          printf 'path=%s\n' "$report" >> "$GITHUB_OUTPUT"
      - name: Upload the complete Gate C Docker PASS report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-c-docker-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gate-c-evidence.outputs.path }}
          if-no-files-found: error
